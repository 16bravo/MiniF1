<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniF1 - Championship Setup</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/championship_setup.css">
    <link rel="stylesheet" href="css/home-button.css">
</head>
<body>
    <div id="setup-header">
        <div id="setup-title">
            <span class="logo-bar"></span>
            Championship Setup
        </div>
        <div id="setup-header-actions">
            <span id="race-count-badge">0 races</span>
            <button id="start-championship-btn">Start Championship</button>
        </div>
    </div>

    <div id="setup-tabs">
        <button class="setup-tab-btn active" data-tab="races-tab">Races</button>
        <button class="setup-tab-btn" data-tab="points-tab">Settings</button>
    </div>

    <div id="setup-body">
        <!-- Races Tab -->
        <div id="races-tab" class="setup-tab-content active">
            <ul id="selected-races"></ul>
        </div>

        <!-- Points Configuration Tab -->
        <div id="points-tab" class="setup-tab-content">
            <!-- Special Championship Mode temporarily disabled (pending reimplementation).
                 Kept in the DOM so championship_setup.js keeps working; hidden from users. -->
            <div id="settings-controls" hidden>
                <div class="settings-control-group">
                    <label class="settings-toggle-label">
                        <input type="checkbox" id="special-championship-toggle" />
                        <span class="settings-toggle-slider"></span>
                        <span class="settings-toggle-text">Special Championship Mode</span>
                    </label>
                    <span class="settings-toggle-desc">Sprint races: 22 → 1 points</span>
                </div>
            </div>
            <div id="points-container"></div>
            <button id="reset-points-btn" class="btn-reset-points">Reset to Defaults</button>
        </div>
    </div>

    <div id="setup-footer">
        <div id="footer-add">
            <select id="race-select"></select>
            <button id="add-race-btn" class="btn-add">+ Add</button>
        </div>
        <button id="reset-championship-btn" class="btn-reinit" title="Reset all championship data">&#9888; Reinit</button>
    </div>

    <script src="js/home-button.js"></script>
    <script src="js/championship_save_select.js"></script>
    <script src="js/championship_setup.js"></script>
</body>
</html>
